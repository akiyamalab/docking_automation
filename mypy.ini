[mypy]
python_version = 3.11

[mypy-docking_automation.infrastructure.external_tools.alpha_cutter]
ignore_errors = True

# rdkit-stubs が古く、rdkit 2023.9.1 の実装 API (Chem.SDMolSupplier, Chem.SDWriter,
# Chem.MolFromMol2File, Chem.Mol, Chem.AddHs 等) をカバーしていないため、
# 実在する rdkit API へのアクセスを attr-defined で誤検知される。
[mypy-rdkit]
follow_imports = skip
ignore_missing_imports = True

[mypy-rdkit.*]
follow_imports = skip
ignore_missing_imports = True

# py.typed マーカー未設定の外部ライブラリ
[mypy-h5py]
ignore_missing_imports = True

[mypy-h5py.*]
ignore_missing_imports = True

[mypy-vina]
ignore_missing_imports = True

[mypy-vina.*]
ignore_missing_imports = True

[mypy-dimorphite_dl]
ignore_missing_imports = True

[mypy-dimorphite_dl.*]
ignore_missing_imports = True

# Uni-Dock 2 (conda-only, dp.tech quetz channel 配布) は CI の Dockerfile に
# 入っていないため import 解決が不可。呼び出し側で runtime import する。
[mypy-unidock_processing]
ignore_missing_imports = True

[mypy-unidock_processing.*]
ignore_missing_imports = True